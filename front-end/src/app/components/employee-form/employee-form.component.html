<div class="w-full max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">


  <h2 class="text-4xl text-center mb-10 font-semibold text-gray-700 mb-6">
    Employee Information Form
  </h2>

  <form [formGroup]="employeeForm" class="space-y-4">

   
    <div class="grid grid-cols-3 items-center gap-4">
      <label class="text-gray-700 font-medium">Employee Number</label>
      <input
        type="number"
        min="1"
        formControlName="employeeNumber"
        class="col-span-2 w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
      />
    </div>

    <div class="grid grid-cols-3 items-center gap-4">
      <label class="text-gray-700 font-medium">First Name</label>
      <input
        type="text"
        formControlName="firstName"
        class="col-span-2 w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
      />
    </div>

    <div class="grid grid-cols-3 items-center gap-4">
      <label class="text-gray-700 font-medium">Last Name</label>
      <input
        type="text"
        formControlName="lastName"
        class="col-span-2 w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
      />
    </div>

    <div class="grid grid-cols-3 items-center gap-4">
      <label class="text-gray-700 font-medium">Date of Birth</label>
      <input
        type="date"
        formControlName="dob"
        class="col-span-2 w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
      />
    </div>

    <div class="grid grid-cols-3 items-center gap-4">
      <label class="text-gray-700 font-medium">Salary</label>
      <input
        type="number"
        formControlName="salary"
        class="col-span-2 w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring"
      />
    </div>

    
    <div class="flex justify-end gap-3 pt-4">
      <button
        type="button"
        (click)="onAdd()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
      >
        Add
      </button>

      <button
        type="button"
        class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600"
      >
        Update
      </button>

      <button
        type="button" 
        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700"
      >
        Delete
      </button>

      <button
        type="button"
        class="px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500"
      >
        Cancel
      </button>
    </div>

  </form>
</div>
