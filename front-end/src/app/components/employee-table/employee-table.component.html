<div class="bg-white p-6 rounded-2xl shadow-lg w-full overflow-x-auto">
  <h2 class="text-2xl font-semibold mb-4 text-gray-700">Employee List</h2>

  <table class="min-w-full divide-y divide-gray-200 table-auto">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">No</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">First Name</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Last Name</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">DOB</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Salary</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr
        *ngFor="let emp of employees"
        [class.bg-red-100]="emp.employeeNo === editedEmployeeNo"
        class="hover:bg-gray-100 transition-colors duration-200 rounded-lg"
      >
        <td class="px-4 py-2 flex items-center gap-2">
          <span *ngIf="emp.employeeNo === editedEmployeeNo" class="w-3 h-3 bg-red-500 rounded-full"></span>
          {{ emp.employeeNo }}
        </td>
        <td class="px-4 py-2">{{ emp.firstName }}</td>
        <td class="px-4 py-2">{{ emp.lastName }}</td>
        <td class="px-4 py-2">{{ emp.dateOfBirth | date:'yyyy-MM-dd' }}</td>
        <td class="px-4 py-2">{{ emp.salary | currency:'LKR ':'symbol':'1.2-2' }}</td>
        <td class="px-4 py-2 flex gap-2 flex-wrap">
          <button class="px-4 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition-colors duration-150" (click)="onEdit(emp)">
            Edit
          </button>
          <button class="px-4 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition-colors duration-150" (click)="onDelete(emp.employeeNo)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
