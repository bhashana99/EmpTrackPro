<div class="w-full max-w-5xl mx-auto mt-6 bg-white p-6 rounded-xl shadow">
  <h2 class="text-xl font-semibold mb-4 text-gray-700">Employee List</h2>

  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Employee No</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">First Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Last Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
          Date of Birth
        </th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Salary</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let emp of employees">
        <td class="px-6 py-4 ">{{ emp.employeeNo }}</td>
        <td class="px-6 py-4">{{ emp.firstName }}</td>
        <td class="px-6 py-4">{{ emp.lastName }}</td>
        <td class="px-6 py-4">{{ emp.dateOfBirth | date : 'yyyy-MM-dd' }}</td>
        <td>{{ emp.salary | currency : 'LKR ' : 'symbol' : '1.2-2' }}</td>
      </tr>
    </tbody>
  </table>
</div>
