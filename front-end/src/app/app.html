<div class="min-h-screen bg-gray-100 p-4">
  <h1 class="text-4xl font-extrabold text-center text-gray-700 mb-8">
    EmpTrack Pro
  </h1>

  <div class="flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto">
    
    
    <div class="flex-1 bg-white p-6 rounded-2xl shadow-lg">
      <app-employee-form [selectedEmployee]="selectedEmployee" (cancelEdit)="onCancelEdit()"></app-employee-form>
    </div>

    
    <div class="flex-2 bg-white p-6 rounded-2xl shadow-lg overflow-x-auto">
      <app-employee-table [editedEmployeeNo]="editedEmployeeNo" (edit)="onEditEmployee($event)"></app-employee-table>
    </div>

  </div>
</div>
<router-outlet></router-outlet>
